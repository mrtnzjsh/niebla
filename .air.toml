root = "."
tmp_dir = "citc-toolchain/tmp"

[build]
  cmd = "cd citc-toolchain && go build -o ./tmp/critique ./cmd/critique"
  bin = "./citc-toolchain/tmp/critique"
  full_bin = ""
  include_ext = ["go"]
  exclude_dir = ["citc-toolchain/assets", "citc-toolchain/tmp", "tmp", "vendor", ".direnv", ".git"]
  include_dir = []
  exclude_file = []
  exclude_regex = [".*_test\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  delay = 300
  stop_on_error = true
  send_interrupt = false
  kill_delay = "500ms"
  rerun = false
  rerun_delay = 500

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
  app = "white"

[log]
  time = false
  main_only = false
  silent = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
