name: Release Candidate Comprehensive Verification

on:
  push:
    branches:
      - 'rc/**'
    tags:
      - 'v*-rc*'

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rc-verification:
    name: Multi-Region Concurrency & Cotejo UI Verification
    runs-on: [self-hosted, linux]
    timeout-minutes: 40
    outputs:
      macos_available: ${{ steps.probe-macos.outputs.macos_available }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Verify Container Runtime Availability
        run: |
          docker info || podman info

      - name: Launch Dedicated Ephemeral Niebla Server & Database Cluster
        run: |
          ./niebla/scripts/ephemeral_test_cluster.sh start 55051

      - name: Run Cross-OS In-Code Interoperability Suite
        run: |
          cd niebla && go test -v ./test/interop/...

      - name: Run Windows 11 KVM Verification Suite
        run: |
          ./niebla/scripts/test_windows_container.sh run system.lan:55051

      - name: Run Release Candidate Integration Suite
        env:
          CGO_ENABLED: '0'
          TESTCONTAINERS_RYUK_DISABLED: 'false'
        run: |
          cd niebla && go test -v -tags=rc -timeout=35m ./test/rc/...

      - name: Probe macOS Apple Silicon Runner Availability
        id: probe-macos
        run: |
          MACOS_AVAILABLE="false"
          if tailscale status 2>/dev/null | grep -iE 'macOS|darwin' | grep -v 'offline' | grep -q .; then
            echo "Discovered online macOS device in Tailscale network."
            MACOS_AVAILABLE="true"
          fi
          if [ "$MACOS_AVAILABLE" = "true" ]; then
            echo "macos_available=true" >> "$GITHUB_OUTPUT"
            echo "✅ macOS test target detected. Scheduling macos-darwin-verification."
          else
            echo "macos_available=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ M1 MacBook Air (macOS) runner is currently offline or unregistered. Logging missing and proceeding without blocking RC pipeline."
          fi

      - name: Report Status
        if: always()
        run: |
          echo "RC verification completed with exit status: $?"

  macos-darwin-verification:
    name: Native macOS Apple Silicon APFS & Remote CL Verification
    needs: rc-verification
    if: ${{ needs.rc-verification.outputs.macos_available == 'true' }}
    runs-on: [self-hosted, macos]
    continue-on-error: true
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Execute Native macOS Remote Test Suite
        run: |
          ./niebla/scripts/test_macos_remote.sh 100.64.225.27:55051

      - name: Report macOS Status
        if: always()
        run: |
          echo "macOS verification completed with exit status: $?"

  teardown-ephemeral:
    name: Teardown Ephemeral Test Server
    runs-on: [self-hosted, linux]
    needs: [rc-verification, macos-darwin-verification]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Teardown Dedicated Ephemeral Server & Database Cluster
        run: |
          ./niebla/scripts/ephemeral_test_cluster.sh stop
