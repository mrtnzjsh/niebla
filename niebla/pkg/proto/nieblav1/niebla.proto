syntax = "proto3";

package niebla.v1;

option go_package = "niebla/pkg/proto/nieblav1;nieblav1";

service NieblaService {
  // Tree / Metadata Lookups (Used by FUSE lookup, readdir, getattr)
  rpc GetTree (GetTreeRequest) returns (GetTreeResponse);
  rpc GetNode (GetNodeRequest) returns (NodeEntry);

  // Content Operations (Used by FUSE open/read & CLI shelve/diff)
  rpc GetBlob (GetBlobRequest) returns (stream BlobChunk);
  rpc ReadBlob (ReadBlobRequest) returns (stream BlobChunk);
  rpc UploadBlob (stream UploadBlobRequest) returns (UploadBlobResponse);

  // Workspace & CL Operations
  rpc CreateWorkspace (CreateWorkspaceRequest) returns (CreateWorkspaceResponse);
  rpc ShelveCL (ShelveCLRequest) returns (ShelveCLResponse);
  rpc SubmitCL (SubmitCLRequest) returns (SubmitCLResponse);
  rpc GetHeadCL (GetHeadCLRequest) returns (GetHeadCLResponse);
  rpc GetCL (GetCLRequest) returns (GetCLResponse);
  rpc SyncCL (SyncCLRequest) returns (SyncCLResponse);
  rpc SyncWorkspace (SyncWorkspaceRequest) returns (SyncWorkspaceResponse);
}

message NodeEntry {
  string name = 1;
  uint32 mode = 2;
  uint64 size = 3;
  bytes blob_sha256 = 4;
  bytes sub_tree_hash = 5; // Empty/null if leaf file
}

message GetTreeRequest {
  bytes tree_hash = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message GetTreeResponse {
  repeated NodeEntry entries = 1;
  string next_page_token = 2;
}

message GetNodeRequest {
  bytes parent_tree_hash = 1;
  string name = 2;
}

message GetBlobRequest {
  bytes sha256 = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

message ReadBlobRequest {
  bytes sha256 = 1;
  uint64 offset = 2;
  uint64 length = 3;
}

message BlobChunk {
  bytes data = 1;
}

message UploadBlobRequest {
  bytes data = 1;
}

message UploadBlobResponse {
  bytes sha256 = 1;
  uint64 size = 2;
}

message CreateWorkspaceRequest {
  string name = 1;
  string owner = 2;
  int64 base_cl = 3; // 0 for head
}

message CreateWorkspaceResponse {
  string workspace_id = 1;
  int64 base_cl = 2;
  bytes root_tree_hash = 3;
}

message ShelveCLRequest {
  string workspace_id = 1;
  string author = 2;
  string description = 3;
  bytes root_tree_hash = 4;
  int64 parent_cl = 5;
  repeated string reviewers = 6;
  int64 cl_id = 7; // Optional: specify target CL ID if re-shelving to existing CL
}

message ShelveCLResponse {
  int64 cl_id = 1;
}

message SubmitCLRequest {
  int64 cl_id = 1;
  bool force = 2;
}

message SubmitCLResponse {
  int64 cl_id = 1;
  int64 committed_at_unix = 2;
  repeated int64 rebased_children = 3;
}

message GetHeadCLRequest {}

message GetHeadCLResponse {
  int64 cl_id = 1;
  bytes root_tree_hash = 2;
}

message GetCLRequest {
  int64 cl_id = 1;
}

message GetCLResponse {
  int64 cl_id = 1;
  string author = 2;
  string description = 3;
  bytes root_tree_hash = 4;
  int64 parent_cl = 5;
  string status = 6;
  bool needs_rebase = 7;
  string rebase_conflict_details = 8;
  int32 current_patchset = 9;
}

message SyncCLRequest {
  string workspace_id = 1;
  int64 cl_id = 2;
}

message SyncCLResponse {
  string workspace_id = 1;
  int64 cl_id = 2;
  int64 parent_cl = 3;
  bytes root_tree_hash = 4;
  bytes parent_root_tree_hash = 5;
  bool needs_rebase = 6;
  string rebase_conflict_details = 7;
  int32 patchset_number = 8;
}

message SyncWorkspaceRequest {
  string workspace_id = 1;
  int64 cl_id = 2;
}

message SyncWorkspaceResponse {
  string workspace_id = 1;
  int64 cl_id = 2;
  int64 parent_cl = 3;
  bytes root_tree_hash = 4;
  bytes parent_root_tree_hash = 5;
  bool needs_rebase = 6;
  string rebase_conflict_details = 7;
  int32 patchset_number = 8;
}
